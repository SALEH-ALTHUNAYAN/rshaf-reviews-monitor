name: Google reviews monitor

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours → collect + instant alerts
    - cron: "3 18 * * *"     # 21:03 Riyadh → daily digest
    - cron: "7 6 * * 6"      # Saturday 09:07 Riyadh → weekly report
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | daily | weekly | analyze"
        default: collect

permissions:
  contents: write

concurrency:
  group: reviews-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "3 18 * * *") echo "mode=daily"  >> "$GITHUB_OUTPUT" ;;
            "7 6 * * 6")  echo "mode=weekly" >> "$GITHUB_OUTPUT" ;;
            "")           echo "mode=${{ inputs.mode || 'collect' }}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "mode=collect" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run monitor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: python monitor.py --mode ${{ steps.mode.outputs.mode }}

      - name: Save data
        if: always()
        run: |
          git config user.name  "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add -A data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: reviews update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
